name: Fixup

on:
  workflow_dispatch:

jobs:
  fixup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply the frontend patch
        run: |
          cat > /tmp/fix.patch <<'PATCH'
          diff --git a/src/modules/sources/yandex/components/YmQrCode.vue b/src/modules/sources/yandex/components/YmQrCode.vue
          --- a/src/modules/sources/yandex/components/YmQrCode.vue
          +++ b/src/modules/sources/yandex/components/YmQrCode.vue
          @@ -1,10 +1,14 @@
           <template>
          -  <img
          -    v-if="qrcode"
          -    :src="qrcode"
          -    :alt="value"
          -    class="block size-full"
          -  >
          +  <!-- The box is the caller's: its size and padding classes land here and
          +       the image fills it. On the img they fought size-full and lost. -->
          +  <div class="overflow-hidden">
          +    <img
          +      v-if="qrcode"
          +      :src="qrcode"
          +      :alt="value"
          +      class="block size-full"
          +    >
          +  </div>
           </template>
           
           <script setup lang="ts">
          diff --git a/src/modules/tracks/components/edit/__tests__/AlbumSelectPanel.test.ts b/src/modules/tracks/components/edit/__tests__/AlbumSelectPanel.test.ts
          --- a/src/modules/tracks/components/edit/__tests__/AlbumSelectPanel.test.ts
          +++ b/src/modules/tracks/components/edit/__tests__/AlbumSelectPanel.test.ts
          @@ -22,6 +22,9 @@ const albums: AlbumEntity[] = [
           // Virtual scrolling needs a measured viewport; happy-dom has none.
           const VirtualScrollableStub = {
             props: ["items"],
          +  // The panel reveals the attached album on mount; the real component exposes
          +  // scrollToIndex, so the stub has to carry it too.
          +  methods: { scrollToIndex: vi.fn() },
             template: `
               <div>
                 <div v-for="(item, index) in items" :key="index">
          PATCH
          sed -i 's/^          //' /tmp/fix.patch
          git apply --recount --ignore-whitespace --verbose /tmp/fix.patch

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt

      - name: Push the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/ci-green
          git add -A
          git commit -m "fix(ci): rustfmt, album picker stub, QR box sizing"
          git push -u origin fix/ci-green --force
          git show --stat --oneline HEAD
