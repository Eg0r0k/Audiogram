name: Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, without the v"
        required: true
        default: "0.2.14"

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump the version in all four files
        env:
          NEW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$NEW\"/" package.json
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$NEW\"/" src-tauri/tauri.conf.json
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$NEW\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"audiogram\"$/{n;s/^version = .*/version = \"$NEW\"/}" src-tauri/Cargo.lock
          git --no-pager diff --stat

      - name: Commit it to main
        env:
          NEW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(version): bump version to $NEW"
          git push origin main
